name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  quality-security-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cesizen
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/cesizen
      NEXTAUTH_URL: http://127.0.0.1:3000
      HDS_COMPLIANT_STORAGE: "0"
      RATE_LIMIT_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Secrets jetables et aléatoires : aucune valeur devinable ne circule,
      # même dans un environnement d'intégration.
      - name: Générer les secrets éphémères
        run: |
          echo "NEXTAUTH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "AUDIT_HMAC_KEY=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "RATE_LIMIT_HMAC_KEY=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
